name: Sync Code to Friend Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Sync to friend's repo
        env:
          FRIEND_TOKEN: ${{ secrets.LIUHAO }}
        run: |
          # 删除 .github 目录（不同步工作流）
          rm -rf .github
          
          # 配置 Git
          git config --global user.name "HaoLiu923"
          git config --global user.email "405685255@qq.com"
          
          # 克隆朋友的 repo（如果为空会失败，所以先初始化）
          git clone https://${FRIEND_TOKEN}@github.com/HaoLiu923/DynHyperRAG.git target || {
            # 如果 repo 为空，创建初始提交
            mkdir target
            cd target
            git init
            git remote add origin https://${FRIEND_TOKEN}@github.com/HaoLiu923/DynHyperRAG.git
            cd ..
          }
          
          # 同步代码（排除 .git 目录）
          rsync -av --delete --exclude='.git' ./ target/
          
          # 提交并推送
          cd target
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Sync from upstream $(date +'%Y-%m-%d %H:%M:%S')"
            git push -f origin main
          else
            echo "No changes to sync"
          fi
